name: Deploy registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_REGISTRY_ROOT: ${{ vars.VPS_REGISTRY_ROOT || '/srv/silex/registry' }}
      REGISTRY_SMOKE_URL: ${{ vars.REGISTRY_SMOKE_URL || 'https://silex-registry.nekmata.com' }}
    steps:
      - name: Check out the registry
        uses: actions/checkout@v6

      - name: Validate and build the registry
        run: node scripts/build-registry.mjs dist/v1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "The VPS deployment secrets must all be configured" >&2
            exit 1
          fi
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_SSH_PORT must be numeric" >&2
            exit 1
          fi
          if [[ ! "$VPS_REGISTRY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_REGISTRY_ROOT must be an absolute path without spaces" >&2
            exit 1
          fi
          if [[ ! "$REGISTRY_SMOKE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "REGISTRY_SMOKE_URL must be one HTTPS origin without a path" >&2
            exit 1
          fi

      - name: Configure the deployment key
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload an immutable release
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          release="$VPS_REGISTRY_ROOT/releases/$GITHUB_SHA"
          if ! ssh -p "$VPS_SSH_PORT" "$target" "test -f '$release/.complete'"; then
            ssh -p "$VPS_SSH_PORT" "$target" "mkdir -p '$release'"
            rsync -az --delete -e "ssh -p $VPS_SSH_PORT" dist/ "$target:$release/"
            ssh -p "$VPS_SSH_PORT" "$target" "test -f '$release/v1/index.json' && touch '$release/.complete'"
          fi

      - name: Activate the release atomically
        shell: bash
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh -p "$VPS_SSH_PORT" "$target" sh -s -- "$VPS_REGISTRY_ROOT" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          registry_root=$1
          release=$2
          next_link="$registry_root/.current-$release"
          ln -sfn "$registry_root/releases/$release" "$next_link"
          mv -Tf "$next_link" "$registry_root/current"
          REMOTE

      - name: Check the public deployment
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 2 --retry-connrefused \
            "$REGISTRY_SMOKE_URL/v1/index.json" \
            | grep -F '"schema": 2'
