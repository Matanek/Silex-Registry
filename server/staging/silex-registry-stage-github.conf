[Service]
# Private staging only. FPM still listens on a Unix socket and cannot see the
# public registry or gateway key. Outbound TCP is needed for GitHub device flow.
Environment=SILEX_GITHUB_CLIENT_ID=Ov23liijZ3iMXfwe7qnz
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
BindReadOnlyPaths=/etc/ssl/certs:/etc/ssl/certs /etc/resolv.conf:/etc/resolv.conf
