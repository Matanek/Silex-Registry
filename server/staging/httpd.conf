ServerRoot /etc/stage
ServerName localhost
Listen 127.0.0.1:18765
PidFile /run/web/httpd.pid
DefaultRuntimeDir /run/web
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/modules/mod_proxy_fcgi.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
User silex-registry-stage-web
Group silex-registry-stage-web
ErrorLog /run/web/error.log
LogLevel warn
ServerTokens Prod
ServerSignature Off
Timeout 30
RequestReadTimeout handshake=5 header=5-10,MinRate=500 body=10,MinRate=1024
LimitRequestFields 32
LimitRequestLine 512
KeepAlive On
MaxKeepAliveRequests 20
KeepAliveTimeout 2
StartServers 1
ServerLimit 1
ThreadsPerChild 8
MaxRequestWorkers 8
MinSpareThreads 2
MaxSpareThreads 6
SSLSessionCache none
<Directory />
    Require all denied
</Directory>
<Location />
    CGIPassAuth On
</Location>
<VirtualHost 127.0.0.1:18765>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /gateway/tls.crt
    SSLCertificateKeyFile /gateway/tls.key
    LimitRequestBody 2097152
    ProxyTimeout 30
    ProxyFCGISetEnvIf "true" HTTPS "on"
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/app/server/public/index.php"
    ProxyFCGISetEnvIf "true" SCRIPT_NAME "/index.php"
    ProxyFCGISetEnvIf "true" !PATH_INFO
    ProxyPassMatch "^/.*$" "unix:/run/stage/fpm.sock|fcgi://localhost/app/server/public/index.php"
</VirtualHost>
