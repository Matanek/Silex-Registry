name = "silex-registry-staging-probe"
main = "src/worker.mjs"
compatibility_date = "2026-09-17"
workers_dev = true
account_id = "99527982b858a931d1a2f7a4bcc7b49d"

[vars]
GITHUB_CLIENT_ID = "Ov23liijZ3iMXfwe7qnz"
BACKUP_REQUIRED = "0"
BACKUP_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
BACKUP_BUCKET = "silex-registry-backup-99527982"
BACKUP_PREFIX = "registry/staging"
BACKUP_LIMIT_BYTES = "8589934592"
BACKUP_RETENTION_DAYS = "90"

[[queues.producers]]
binding = "BACKUP_QUEUE"
queue = "silex-registry-backup-staging"

[[queues.consumers]]
queue = "silex-registry-backup-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "silex-registry-backup-staging-dead"
max_concurrency = 2
retry_delay = 60

[[d1_databases]]
binding = "DB"
database_name = "silex-registry-staging"
database_id = "e40f547b-07d2-4119-9144-f8e2b80d13c2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "silex-registry-staging"
