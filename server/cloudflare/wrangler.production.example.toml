# Copier et renseigner les ressources dédiées avant toute mise en service.
# Ce modèle ne configure aucun domaine et ne porte aucun secret ni jeton de banc.
name = "silex-registry"
main = "src/worker.mjs"
compatibility_date = "2026-09-17"
workers_dev = false
account_id = "REPLACE_WITH_ACCOUNT_ID"

[vars]
GITHUB_CLIENT_ID = "Ov23liijZ3iMXfwe7qnz"
BACKUP_REQUIRED = "1"
BACKUP_ENDPOINT = "https://s3.REPLACE_WITH_B2_REGION.backblazeb2.com"
BACKUP_BUCKET = "REPLACE_WITH_PRIVATE_B2_BUCKET"
BACKUP_PREFIX = "registry/production"
BACKUP_LIMIT_BYTES = "8589934592"
BACKUP_RETENTION_DAYS = "90"

[triggers]
crons = [ "15 3 * * *" ]

[[queues.producers]]
binding = "BACKUP_QUEUE"
queue = "silex-registry-backup"

[[queues.consumers]]
queue = "silex-registry-backup"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "silex-registry-backup-dead"
max_concurrency = 2
retry_delay = 60

[[d1_databases]]
binding = "DB"
database_name = "silex-registry"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "silex-registry"
