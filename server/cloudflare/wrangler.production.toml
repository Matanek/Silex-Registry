# Instance de production distincte du staging. workers.dev reste disponible
# pendant la qualification du domaine officiel et le retrait de la VPS.
name = "silex-registry"
main = "src/worker.mjs"
compatibility_date = "2026-09-17"
workers_dev = true
account_id = "99527982b858a931d1a2f7a4bcc7b49d"

[[routes]]
pattern = "registry.silex-lang.org"
custom_domain = true

[vars]
GITHUB_CLIENT_ID = "Ov23liijZ3iMXfwe7qnz"
BACKUP_REQUIRED = "1"
BACKUP_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
BACKUP_BUCKET = "silex-registry-backup-99527982"
BACKUP_PREFIX = "registry/production"
BACKUP_LIMIT_BYTES = "8589934592"
BACKUP_RETENTION_DAYS = "90"

[triggers]
crons = [ "15 3 * * *" ]

[[queues.producers]]
binding = "BACKUP_QUEUE"
queue = "silex-registry-backup"

[[queues.consumers]]
queue = "silex-registry-backup"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "silex-registry-backup-dead"
max_concurrency = 2
retry_delay = 60

[[d1_databases]]
binding = "DB"
database_name = "silex-registry"
database_id = "b4068e5b-7353-494c-bb44-ac1236e3481f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "silex-registry"
