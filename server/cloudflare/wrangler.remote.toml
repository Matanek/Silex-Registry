# Local Worker runtime bound to the already existing staging D1/R2 resources.
# No workers.dev route or deployed Worker is needed for this probe.
name = "silex-registry-staging-probe"
main = "src/worker.mjs"
compatibility_date = "2026-09-17"
workers_dev = false
account_id = "99527982b858a931d1a2f7a4bcc7b49d"

[vars]
GITHUB_CLIENT_ID = "Ov23liijZ3iMXfwe7qnz"

[[d1_databases]]
binding = "DB"
database_name = "silex-registry-staging"
database_id = "e40f547b-07d2-4119-9144-f8e2b80d13c2"
migrations_dir = "migrations"
remote = true

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "silex-registry-staging"
remote = true
