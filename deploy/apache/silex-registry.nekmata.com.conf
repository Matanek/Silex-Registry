<VirtualHost *:80>
    ServerName silex-registry.nekmata.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog /var/log/apache2/silex-registry.nekmata.com-error.log
    CustomLog /var/log/apache2/silex-registry.nekmata.com-access.log combined
</VirtualHost>
