<VirtualHost *:80>
    ServerName registry.silex-lang.org
    DocumentRoot /srv/silex/registry/current

    <Directory /srv/silex/registry/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/registry.silex-lang.org-error.log
    CustomLog /var/log/apache2/registry.silex-lang.org-access.log combined
</VirtualHost>
