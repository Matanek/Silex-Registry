<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName silex-registry.nekmata.com
    DocumentRoot /srv/silex/registry/current

    <Directory /srv/silex/registry/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/silex-registry.nekmata.com-error.log
    CustomLog /var/log/apache2/silex-registry.nekmata.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/silex-registry.nekmata.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/silex-registry.nekmata.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
